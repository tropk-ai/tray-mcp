name = "tray-mcp"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Workers observability
[observability]
enabled = true

# Public environment variables.
# Secrets (DATABASE_URL, TRAY_CONSUMER_KEY, TRAY_CONSUMER_SECRET,
# PREAUTH_SECRET) are uploaded with `wrangler secret put <NAME>` and are
# NOT listed here. MCP_HOST is public and is updated to the real
# workers.dev URL after the first deploy.
[vars]
MCP_HOST = "https://tray-mcp.gardelin.workers.dev"

# Example of a production environment override.
# [env.production.vars]
# MCP_HOST = "https://tray-mcp.example.com"
